services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: scripelle
      POSTGRES_USER: scripelle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scripelle-local-db:/var/lib/postgresql/data
volumes:
  scripelle-local-db:
